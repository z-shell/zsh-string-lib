version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - actionlint@1.7.12
    - git-diff-check
    - gitleaks@8.30.1
    - markdownlint@0.48.0
    - prettier@3.8.3
runtimes:
  enabled:
    - go@1.25.13
    - node@22.16.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
